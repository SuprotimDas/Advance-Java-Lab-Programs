<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #1f1e2d;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Main heading */
        .main-heading {
            margin-top: 128px;
            text-align: center;
            color: #eeeeee;
            font-size: 38px;
            font-weight: 700;
            line-height: 1.08;
            letter-spacing: 0.5px;
        }

        /* White container */
        .container {
            width: 685px;
            height: 430px;
            margin-top: 12px;
            background: #eeeeee;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.3);
        }

        /* Inner heading */
        .container h2 {
            margin-top: 38px;
            margin-bottom: 33px;
            color: #292936;
            font-size: 29px;
            font-weight: 600;
        }

        /* Buttons */
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 13px;
        }

        .buttons button {
            width: 240px;
            height: 49px;
            border: none;
            border-radius: 6px;
            background: #1769e0;
            color: white;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
        }

        .buttons button:hover {
            background: #125dcc;
        }

        .buttons button:active {
            transform: scale(0.99);
        }
    </style>
</head>

<body>

    <h1 class="main-heading">
        HTML PAGE FOR EMPLOYEE<br>
        MANAGEMENT
    </h1>

    <div class="container">

        <h2>Employee Management System</h2>

        <div class="buttons">
            <button>Add Employee</button>
            <button>View Employees</button>
            <button>Update Employee</button>
            <button>Delete Employee</button>
            <button>Test DB Connection</button>
        </div>

    </div>

</body>
</html>
